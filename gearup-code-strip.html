<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>GearUp Booster Bumper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:240px;transform-origin:0 0;font-family:"Orbitron","Segoe UI","Arial Black",sans-serif}
.glow{position:absolute;left:660px;top:120px;width:600px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(40,140,255,.45),rgba(30,220,240,.12) 55%,transparent 70%);opacity:0}
.phone{position:absolute;left:772px;top:40px;width:376px;height:656px;box-sizing:border-box;padding:8px;border-radius:58px;
 background:linear-gradient(150deg,#5fe3ff,#2a6bff 45%,#7a5cff);box-shadow:0 0 36px #2a8bff,0 0 120px rgba(30,200,255,.5);opacity:0;transform:translateY(280px) scale(.85) rotate(-4deg)}
.screen{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#080f22}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s1{opacity:0}
.screen:before{content:'';position:absolute;z-index:5;left:50%;top:12px;width:92px;height:26px;margin-left:-46px;border-radius:14px;background:#02030a}
.screen:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 32%);pointer-events:none}
.tap{position:absolute;left:37px;top:56px;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid #7fe9ff;opacity:0}
.dot{position:absolute;left:37px;top:56px;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 18px #5fe3ff;opacity:0}
.streak{position:absolute;height:3px;border-radius:3px;opacity:0;background:linear-gradient(90deg,transparent,#6fe3ff,#6f8bff,transparent)}
.wrap{position:absolute;left:0;right:0;top:0;height:240px;display:flex;justify-content:center;align-items:center;gap:30px;font-weight:800;font-size:108px;letter-spacing:.08em;white-space:nowrap}
.logo{width:130px;height:130px;opacity:0;transform:translateY(70px);filter:drop-shadow(0 0 18px #3a8bff)}
.label{color:#dbe6ff;text-shadow:0 0 14px #3a8bff;opacity:0;transform:translateY(70px)}
.code{opacity:0;transform:translateY(70px);background:linear-gradient(90deg,#5fe3ff,#4a7bff,#a58cff,#5fe3ff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px #3a8bff) drop-shadow(0 0 32px #1de2f0)}
.go .glow{animation:fadeIn 1s ease .3s forwards,breathe 2s ease-in-out 1.3s infinite,fadeOut .5s ease 6s forwards}
.go .phone{animation:phoneIn 1s cubic-bezier(.2,.9,.2,1) forwards,fadeOut .5s ease 6s forwards}
.go .s1{animation:fadeIn .45s ease 1.75s forwards,push 3s ease-out 1.75s forwards}
.go .tap{animation:ripple .6s ease-out 1.25s}
.go .dot{animation:dot .5s ease 1.2s}
.go .streak{animation:zoom .6s linear forwards}
.go .logo{animation:rise .7s cubic-bezier(.2,.9,.2,1) 1.9s forwards,fadeOut .5s ease 6s forwards}
.go .label{animation:rise .7s cubic-bezier(.2,.9,.2,1) 2.1s forwards,fadeOut .5s ease 6s forwards}
.go .code{animation:rise .7s cubic-bezier(.2,.9,.2,1) 2.4s forwards,shine 2.2s linear 3s infinite,pulse 1.4s ease-in-out 3.1s infinite,fadeOut .5s ease 6s forwards}
@keyframes phoneIn{to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes breathe{50%{transform:scale(1.08)}}
@keyframes push{to{transform:scale(1.07)}}
@keyframes ripple{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
@keyframes dot{0%{opacity:0;transform:scale(1.6)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes zoom{0%{opacity:0;transform:translateX(var(--f))}25%{opacity:.9}100%{opacity:0;transform:translateX(var(--t))}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-250% 0}}
@keyframes pulse{50%{scale:1.04}}
</style></head><body>
